<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="10" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="300" cy="90" r="100" fill="#7C93A0" opacity="0.4" filter="url(#soft)"/><circle cx="110" cy="230" r="90" fill="#A98A4E" opacity="0.25" filter="url(#soft)"/><circle cx="230" cy="240" r="70" fill="#B85C6B" opacity="0.2" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <path d="M120 200 L280 200 L260 230 L140 230 Z"/>
    <path d="M200 200 L200 110 M200 120 L245 135 L200 150" />
    <path d="M80 245 Q120 225 160 245 Q200 265 240 245 Q280 225 320 245" stroke-width="2.5"/>
    <path d="M320 130 L320 90 M310 90 L330 90 M320 80 Q330 85 320 70 Q310 85 320 80" stroke-width="2"/>
    
</g>
</svg>