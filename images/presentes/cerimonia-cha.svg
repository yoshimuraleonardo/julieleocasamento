<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="200" cy="90" r="100" fill="#74804F" opacity="0.4" filter="url(#soft)"/><circle cx="300" cy="220" r="80" fill="#A98A4E" opacity="0.25" filter="url(#soft)"/><circle cx="100" cy="230" r="70" fill="#B85C6B" opacity="0.2" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <path d="M140 170 Q140 230 200 230 Q260 230 260 170 Z"/>
    <ellipse cx="200" cy="170" rx="60" ry="14"/>
    <path d="M195 60 Q205 80 195 100 Q185 120 195 140" stroke-width="2"/>
    <path d="M215 65 Q225 85 215 105 Q205 125 215 145" stroke-width="2"/>
    <path d="M175 150 L175 90 M180 90 Q195 85 175 78" stroke-width="2"/>
    
</g>
</svg>