<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="200" cy="100" r="100" fill="#B85C6B" opacity="0.4" filter="url(#soft)"/><circle cx="320" cy="220" r="80" fill="#A98A4E" opacity="0.3" filter="url(#soft)"/><circle cx="90" cy="230" r="70" fill="#74804F" opacity="0.2" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <rect x="110" y="170" width="180" height="20" rx="4"/>
    <path d="M130 170 Q160 140 190 165 Q220 140 250 165 Q270 150 280 170" />
    <path d="M150 155 Q160 148 170 155 M200 152 Q210 145 220 152" stroke-width="1.5" opacity="0.6"/>
    <path d="M300 120 L330 210 M310 118 L340 208" stroke-width="3"/>
    
</g>
</svg>