<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="200" cy="110" r="100" fill="#B85C6B" opacity="0.35" filter="url(#soft)"/><circle cx="90" cy="230" r="80" fill="#A98A4E" opacity="0.3" filter="url(#soft)"/><circle cx="310" cy="220" r="70" fill="#7C93A0" opacity="0.25" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="200" cy="140" r="70"/>
    <circle cx="200" cy="140" r="8" fill="#38492E" stroke="none"/>
    <path d="M200 70 L200 210 M130 140 L270 140 M150 90 L250 190 M150 190 L250 90" stroke-width="1.5"/>
    <path d="M200 210 L200 260" stroke-width="3"/>
    <path d="M120 260 L280 260"/>
    <path d="M90 260 L90 230 L110 245 Z" fill="#A98A4E" stroke="none" opacity="0.8"/>
    <path d="M290 260 L290 235 L310 248 Z" fill="#B85C6B" stroke="none" opacity="0.8"/>
    
</g>
</svg>