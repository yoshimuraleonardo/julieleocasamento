<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="310" cy="80" r="90" fill="#B85C6B" opacity="0.4" filter="url(#soft)"/><circle cx="100" cy="200" r="100" fill="#A98A4E" opacity="0.3" filter="url(#soft)"/><circle cx="250" cy="250" r="70" fill="#7C93A0" opacity="0.25" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <rect x="110" y="175" width="180" height="55" rx="26"/>
    <circle cx="150" cy="202" r="20"/>
    <circle cx="200" cy="196" r="20"/>
    <circle cx="250" cy="202" r="20"/>
    <path d="M140 150 Q170 130 200 148 Q230 130 260 150" stroke-width="2"/>
    <path d="M300 150 L330 90" stroke-width="3"/>
    <path d="M310 150 L340 90" stroke-width="3"/>
    
</g>
</svg>