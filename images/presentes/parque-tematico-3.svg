<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="150" cy="100" r="100" fill="#A98A4E" opacity="0.35" filter="url(#soft)"/><circle cx="300" cy="180" r="90" fill="#B85C6B" opacity="0.3" filter="url(#soft)"/><circle cx="90" cy="240" r="70" fill="#74804F" opacity="0.2" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <rect x="110" y="130" width="160" height="110" rx="4"/>
    <path d="M110 160 L270 160" stroke-width="3"/>
    <path d="M120 130 L140 160 M150 130 L170 160 M180 130 L200 160 M210 130 L230 160 M240 130 L260 160" stroke-width="3"/>
    <path d="M280 250 Q330 250 330 210 Q330 170 290 175 Q260 178 270 210 Q278 235 310 225" stroke-width="2.5"/>
    
</g>
</svg>