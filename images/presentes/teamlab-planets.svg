<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="6" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="150" cy="110" r="100" fill="#7C93A0" opacity="0.4" filter="url(#soft)"/><circle cx="280" cy="150" r="90" fill="#B85C6B" opacity="0.3" filter="url(#soft)"/><circle cx="200" cy="240" r="90" fill="#A98A4E" opacity="0.3" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="150" cy="120" r="35"/>
    <circle cx="260" cy="160" r="22"/>
    <circle cx="200" cy="90" r="14"/>
    <path d="M60 230 Q200 250 340 230" stroke-width="2"/>
    <path d="M100 240 Q100 260 130 260 M240 245 Q240 265 270 265" stroke-width="1.5" opacity="0.6"/>
    
</g>
</svg>