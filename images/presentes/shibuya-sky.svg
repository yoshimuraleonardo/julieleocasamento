<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="200" cy="70" r="110" fill="#7C93A0" opacity="0.45" filter="url(#soft)"/><circle cx="320" cy="240" r="80" fill="#B85C6B" opacity="0.25" filter="url(#soft)"/><circle cx="80" cy="250" r="70" fill="#A98A4E" opacity="0.2" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="300" cy="80" r="30"/>
    <path d="M80 260 L80 160 L115 160 L115 260" />
    <path d="M130 260 L130 120 L170 120 L170 260" />
    <path d="M185 260 L185 180 L215 180 L215 260" />
    <path d="M230 260 L230 140 L260 140 L260 260" />
    <path d="M60 260 L320 260"/>
    
</g>
</svg>