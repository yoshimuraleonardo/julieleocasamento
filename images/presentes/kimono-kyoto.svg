<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="200" cy="100" r="100" fill="#B85C6B" opacity="0.4" filter="url(#soft)"/><circle cx="90" cy="240" r="80" fill="#A98A4E" opacity="0.25" filter="url(#soft)"/><circle cx="310" cy="230" r="70" fill="#74804F" opacity="0.25" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <path d="M200 70 L160 100 L120 260 L160 260 L175 150 L200 260 L225 150 L240 260 L280 260 L240 100 Z"/>
    <path d="M170 150 L230 150" stroke-width="10"/>
    <circle cx="200" cy="65" r="10"/>
    <path d="M330 90 Q345 75 360 90 Q345 105 330 90 Z" fill="#B85C6B" stroke="none" opacity="0.8"/>
    
</g>
</svg>