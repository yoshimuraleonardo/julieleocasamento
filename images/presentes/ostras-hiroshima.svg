<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#FBF8F1"/>

  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<g filter="url(#wc)"><circle cx="300" cy="80" r="90" fill="#7C93A0" opacity="0.4" filter="url(#soft)"/><circle cx="120" cy="220" r="100" fill="#B85C6B" opacity="0.3" filter="url(#soft)"/><circle cx="250" cy="240" r="70" fill="#A98A4E" opacity="0.25" filter="url(#soft)"/></g>
<g fill="none" stroke="#38492E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <path d="M60 260 L340 260" stroke-width="2"/>
    <path d="M130 120 L130 260 M170 120 L170 260" stroke-width="6"/>
    <path d="M115 120 L185 120" stroke-width="8"/>
    <path d="M105 100 L195 100" stroke-width="6"/>
    <path d="M138 160 L162 160" stroke-width="4"/>
    <path d="M240 200 Q270 170 300 200 Q300 230 270 245 Q240 230 240 200 Z"/>
    <circle cx="270" cy="205" r="7" fill="#B85C6B" stroke="none"/>
    
</g>
</svg>